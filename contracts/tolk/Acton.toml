[package]
name = "rcr-ton-contracts"
description = "RCR TON capped Jetton contracts and sandbox tests"
version = "0.1.0"
license = "MIT"

[toolchain]
acton = "1.2.1"

[contracts.JettonMinter]
src = "src/JettonMinter.tolk"

[[contracts.JettonMinter.depends]]
name = "JettonWallet"
kind = "embed_code"
function = "jettonWalletCompiledCode"

[contracts.JettonWallet]
src = "src/JettonWallet.tolk"

[contracts.MiningIssuer]
src = "src/MiningIssuer.tolk"

[[contracts.MiningIssuer.depends]]
name = "JettonWallet"
kind = "embed_code"
function = "jettonWalletCompiledCode"

[import-mappings]
acton = ".acton"
gen = "gen"
tests = "tests"
wrappers = "wrappers"

[build]
output-fift = "build/fift"

[scripts]
generate-wrappers = """
acton wrapper JettonMinter -o wrappers/JettonMinter.gen.tolk &&
acton wrapper JettonWallet -o wrappers/JettonWallet.gen.tolk &&
acton wrapper MiningIssuer -o wrappers/MiningIssuer.gen.tolk
"""
test-jetton = "acton test tests"
deploy-rcr-testnet = "acton script scripts/deploy.tolk --net testnet"
